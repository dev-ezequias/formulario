<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Limelight&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Shadows+Into+Light+Two&display=swap" rel="stylesheet">
    <title>Formulário de Inscrição</title>
</head>
<body>
<main>
    <h1>Formulário de Inscrição</h1>
    <form action="#" method="POST">
        
        <fieldset>
            <legend>Informações pessoais</legend>
            <section class="Informações-pessoais">
                <label for="name">Nome:</label>
                <input type="text" id="name" required placeholder="Insira seu nome completo">

                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="seu@email.com" required autocomplete="email">

                <label for="tel">Celular:</label>
                <input type="tel" id="tel" required autocomplete="tel" placeholder="Seu Celular">

                <label for="date">Data de Nascimento</label>
                <input type="date" id="date" required name="suadata">

                <label for="cpf">Insira seu CPF</label>
                <input type="text" id="cpf" inputmode="numeric" pattern="\d{3}\.?\d{3}\.?\d{3}-?\d{2}" required placeholder="CPF com 11 dígitos" >
            </section>
        </fieldset>

        <fieldset>
            <legend>Endereço Residencial</legend>
            <h2>Endereço Residencial</h2>
                <section class="endereço-residencial">
                    <label for="cep">CEP: </label>
                    <input type="text" id="cep" required placeholder="Insira seu CEP residencial">
                    <label for="rua">Rua:</label>
                    <input type="text" id="rua" required placeholder="Logradouro">
                    <label for="numero">Número da residência:</label>
                    <input type="text" name="numero" id="numero" required>
                    <label for="bairro">Bairro:</label>
                    <input type="text" id="bairro" required placeholder="Bairro">
                    <label for="cidade">Cidade:</label>
                    <input type="text" id="cidade" required placeholder="Cidade">
                </section>
        </fieldset>

        <fieldset class="oportunidade">
            <h2>Sobre a oportunidade</h2>
                <label for="descobriu">Selecione como ficou sabendo sobre o curso:</label>
                    <select name="redes-sociais" id="descobriu">
                        <option value="" disabled selected>Selecione uma opção</option>
                        <option value="LinkedIn">LinkedIn</option>
                        <option value="Instagram">Instagram</option>
                        <option value="Google">Google</option>
                        <option value="Indicação">Indicação</option>
                    </select>
                    <h2>Qual seu nível de conhecimento?</h2>
        
                <label for="opções-nivel">Selecione</label>
                    <select name="nivel-conhecimento" id="nivel-conhecimento">
                        <option value="" disabled selected>Selecione uma opção</option>
                        <option value="iniciante">Iniciante</option>
                        <option value="intermediario">Intermediário</option>
                        <option value="avancado">Avançado</option>
                        <option value="perdido">Estou perdido sobre o assunto</option>
                    </select>
                <div>
                    <button type="submit">Enviar inscrição</button>
                </div>
        </fieldset>
    </form>
</main>
    
</body>
</html>
